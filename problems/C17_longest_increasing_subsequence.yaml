    - 6
  expected: 6
compare: exact
time_limit_ms: 2000
hints:
- 'O(n^2) DP: `dp[i]` = length of LIS ending at index `i`, where `dp[i] = 1 + max([dp[j]
  for j < i if nums[j] < nums[i]], default=0)`.'
- To optimize to O(n log n), maintain a sorted array `tails` where `tails[k]` is the
  smallest tail of any increasing subsequence of length `k + 1`.
- For each `x` in `nums`, binary search `idx = bisect_left(tails, x)` and either append
  `x` or replace `tails[idx] = x`.
optimal:
  time: O(n log n)
  space: O(n)
follow_ups:
- Why do we use `bisect_left` for strictly increasing subsequences, and what changes
  if non-decreasing (`<=`) is allowed?
reference_solution: "from bisect import bisect_left\n\ndef length_of_lis(nums: list[int])\
  \ -> int:\n    tails: list[int] = []\n    for x in nums:\n        idx = bisect_left(tails,\
  \ x)\n        if idx == len(tails):\n            tails.append(x)\n        else:\n\
  \            tails[idx] = x\n    return len(tails)\n"
