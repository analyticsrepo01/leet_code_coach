id: C17
slug: longest-increasing-subsequence
title: Longest Increasing Subsequence (LIS)
kind: coding
track: cs
leetcode: 300
day: 1
pattern:
- dynamic_programming
- binary_search
difficulty: medium
post_training_relevance: Bridges O(n^2) DP and O(n log n) Patience Sorting with `bisect_left`.
statement: Given an integer array `nums`, return *the length of the longest strictly
  increasing subsequence*.
examples:
- input: nums = [10,9,2,5,3,7,101,18]
  output: '4'
  explanation: The longest increasing subsequence is [2,3,7,101], therefore the length
    is 4.
- input: nums = [0,1,0,3,2,3]
  output: '4'
- input: nums = [7,7,7,7]
  output: '1'
constraints:
- 1 <= len(nums) <= 2500
- -10^4 <= nums[i] <= 10^4
function_name: length_of_lis
starter_code: "def length_of_lis(nums: list[int]) -> int:\n    pass\n"
tests:
- args:
  - - 10
    - 9
    - 2
    - 5
    - 3
    - 7
    - 101
    - 18
  expected: 4
- args:
  - - 0
    - 1
    - 0
    - 3
    - 2
    - 3
  expected: 4
- args:
  - - 7
    - 7
    - 7
    - 7
  expected: 1
hidden_tests:
- args:
  - - 1
    - 3
    - 6
    - 7
    - 9
    - 4
    - 10
