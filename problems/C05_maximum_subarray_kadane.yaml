id: C05
slug: maximum-subarray-kadane
title: Maximum Subarray (Kadane's Algorithm)
kind: coding
track: cs
leetcode: 53
day: 1
pattern:
- dynamic_programming
- greedy
- prefix_sum
difficulty: easy
post_training_relevance: Kadane's O(n) streaming DP is a classic building block for
  signal detection, reward burst finding, and array optimization.
statement: Given an integer array `nums`, find the contiguous subarray (containing
  at least one number) which has the largest sum and return *its sum*.
examples:
- input: nums = [-2,1,-3,4,-1,2,1,-5,4]
  output: '6'
  explanation: The subarray [4,-1,2,1] has the largest sum 6.
- input: nums = [1]
  output: '1'
- input: nums = [5,4,-1,7,8]
  output: '23'
constraints:
- 1 <= len(nums) <= 10^5
- -10^4 <= nums[i] <= 10^4
function_name: max_subarray
starter_code: "def max_subarray(nums: list[int]) -> int:\n    # Track current best\
  \ subarray ending at index i and global best\n    pass\n"
tests:
- args:
  - - -2
    - 1
    - -3
    - 4
    - -1
    - 2
    - 1
    - -5
    - 4
  expected: 6
- args:
  - - 1
  expected: 1
- args:
  - - 5
    - 4
    - -1
    - 7
    - 8
  expected: 23
hidden_tests:
- args:
  - - -5
    - -2
    - -9
  expected: -2
- args:
  - - -1
    - 10
    - -2
    - 10
    - -5
  expected: 18
compare: exact
time_limit_ms: 2000
hints:
- 'At each element `x`, you have two choices: extend the previous subarray (`cur +
  x`) or start fresh at `x`.'
- When would extending the previous subarray hurt you? Whenever `cur < 0`!
- Maintain `cur = max(x, cur + x)` and `best = max(best, cur)` initialized at `nums[0]`.
optimal:
  time: O(n)
  space: O(1)
follow_ups:
- What happens if all numbers in `nums` are negative? Does your initialization handle
  `[-5, -2, -9]` -> `-2`?
- How can you also return the start and end indices `(left, right)` of the maximum
  subarray?
reference_solution: "def max_subarray(nums: list[int]) -> int:\n    cur = best = nums[0]\n\
  \    for x in nums[1:]:\n        cur = max(x, cur + x)\n        best = max(best,\
  \ cur)\n    return best\n"
