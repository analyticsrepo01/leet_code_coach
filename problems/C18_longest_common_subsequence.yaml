id: C18
slug: longest-common-subsequence
title: Longest Common Subsequence (LCS)
kind: coding
track: cs
leetcode: 1143
day: 1
pattern:
- dynamic_programming
- strings
difficulty: medium
post_training_relevance: Foundation of 2D sequence alignment, `git diff`, ROUGE-L
  evaluation metrics, and Edit Distance.
statement: 'Given two strings `text1` and `text2`, return *the length of their longest
  common subsequence*. If there is no common subsequence, return `0`.


  A **subsequence** of a string is a new string generated from the original string
  with some characters (can be none) deleted without changing the relative order of
  the remaining characters.'
examples:
- input: text1 = "abcde", text2 = "ace"
  output: '3'
  explanation: The longest common subsequence is "ace".
- input: text1 = "abc", text2 = "def"
  output: '0'
constraints:
- 1 <= len(text1), len(text2) <= 1000
function_name: longest_common_subsequence
starter_code: "def longest_common_subsequence(text1: str, text2: str) -> int:\n  \
  \  pass\n"
tests:
- args:
  - abcde
  - ace
  expected: 3
- args:
  - abc
  - abc
  expected: 3
- args:
  - abc
  - def
  expected: 0
hidden_tests:
- args:
  - bsbininm
  - jmjkbkjkv
  expected: 1
compare: exact
time_limit_ms: 2000
hints:
- Define `dp[i][j]` as the LCS of `text1[:i]` and `text2[:j]`.
- If `text1[i-1] == text2[j-1]`, both characters match so `dp[i][j] = 1 + dp[i-1][j-1]`.
- Otherwise, `dp[i][j] = max(dp[i-1][j], dp[i][j-1])`.
optimal:
  time: O(m * n)
  space: O(min(m, n))
follow_ups:
- How is LCS used to compute the ROUGE-L score in LLM summarization evaluation?
reference_solution: "def longest_common_subsequence(text1: str, text2: str) -> int:\n\
  \    m, n = len(text1), len(text2)\n    prev = [0] * (n + 1)\n    for i in range(1,\
  \ m + 1):\n        cur = [0] * (n + 1)\n        for j in range(1, n + 1):\n    \
  \        if text1[i - 1] == text2[j - 1]:\n                cur[j] = 1 + prev[j -\
  \ 1]\n            else:\n                cur[j] = max(prev[j], cur[j - 1])\n   \
  \     prev = cur\n    return prev[n]\n"
