id: C09
slug: daily-temperatures
title: Daily Temperatures
kind: coding
track: cs
leetcode: 739
day: 1
pattern:
- stack
difficulty: medium
post_training_relevance: The canonical Monotonic Decreasing Stack problem — finding
  the next greater element in O(n) amortized time.
statement: Given an array of integers `temperatures` represents the daily temperatures,
  return an array `answer` such that `answer[i]` is the number of days you have to
  wait after the `i`-th day to get a warmer temperature. If there is no future day
  for which this is possible, keep `answer[i] == 0` instead.
examples:
- input: temperatures = [73,74,75,71,69,72,76,73]
  output: '[1,1,4,2,1,1,0,0]'
- input: temperatures = [30,40,50,60]
  output: '[1,1,1,0]'
constraints:
- 1 <= len(temperatures) <= 10^5
- 30 <= temperatures[i] <= 100
function_name: daily_temperatures
starter_code: "def daily_temperatures(temperatures: list[int]) -> list[int]:\n   \
  \ pass\n"
