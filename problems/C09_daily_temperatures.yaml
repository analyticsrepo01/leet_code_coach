compare: exact
time_limit_ms: 2000
hints:
- Maintain a stack of indices `i` whose warmer day hasn't been found yet.
- Notice that the temperatures at the indices on the stack are always monotonically
  non-increasing.
- When today's temperature `t` is strictly greater than `temperatures[stack[-1]]`,
  pop `prev = stack.pop()` and set `ans[prev] = i - prev`.
optimal:
  time: O(n)
  space: O(n)
follow_ups:
- Why is the nested `while` loop inside the `for` loop still $O(n)$ total time instead
  of $O(n^2)$?
reference_solution: "def daily_temperatures(temperatures: list[int]) -> list[int]:\n\
  \    ans = [0] * len(temperatures)\n    stack: list[int] = []\n    for i, t in enumerate(temperatures):\n\
  \        while stack and temperatures[stack[-1]] < t:\n            prev = stack.pop()\n\
  \            ans[prev] = i - prev\n        stack.append(i)\n    return ans\n"
