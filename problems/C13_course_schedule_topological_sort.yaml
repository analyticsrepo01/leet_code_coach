id: C13
slug: course-schedule-topological-sort
title: Course Schedule (Cycle Detection / Topological Sort)
kind: coding
track: cs
leetcode: 207
day: 1
pattern:
- graphs_bfs_dfs
difficulty: medium
post_training_relevance: Directed Acyclic Graph (DAG) dependency resolution & cycle
  detection (Kahn's BFS or 3-color DFS) — critical for DAG pipelines and task schedulers.
statement: 'There are a total of `num_courses` courses you have to take, labeled from
  `0` to `num_courses - 1`. You are given an array `prerequisites` where `prerequisites[i]
  = [a, b]` indicates that you **must** take course `b` first if you want to take
  course `a`.


  Return `True` if you can finish all courses. Otherwise, return `False`.'
examples:
- input: num_courses = 2, prerequisites = [[1,0]]
  output: 'True'
- input: num_courses = 2, prerequisites = [[1,0],[0,1]]
  output: 'False'
  explanation: Cycle between 0 and 1.
constraints:
- 1 <= num_courses <= 2000
- 0 <= len(prerequisites) <= 5000
function_name: can_finish_courses
starter_code: "def can_finish_courses(num_courses: int, prerequisites: list[list[int]])\
  \ -> bool:\n    pass\n"
tests:
- args:
  - 2
  - - - 1
      - 0
  expected: true
- args:
  - 2
  - - - 1
      - 0
    - - 0
      - 1
  expected: false
- args:
  - 4
  - - - 1
      - 0
    - - 2
      - 0
    - - 3
      - 1
    - - 3
      - 2
  expected: true
hidden_tests:
- args:
  - 3
  - - - 0
      - 1
    - - 1
      - 2
    - - 2
      - 0
  expected: false
- args:
