  - []
  expected: true
compare: exact
time_limit_ms: 2000
hints:
- 'This problem asks: does the directed prerequisite graph contain a cycle?'
- 'Kahn''s Algorithm (BFS): Compute `indegree[u]` for every course. Push all courses
  with `indegree == 0` into a queue.'
- Pop courses from the queue, decrement the `indegree` of their dependents, and push
  any course whose `indegree` hits `0`. If you visit all `num_courses`, there is no
  cycle!
optimal:
  time: O(V + E)
  space: O(V + E)
follow_ups:
- How would you also output a valid course ordering (Course Schedule II, LC 210)?
reference_solution: "from collections import deque\n\ndef can_finish_courses(num_courses:\
  \ int, prerequisites: list[list[int]]) -> bool:\n    adj = [[] for _ in range(num_courses)]\n\
  \    indeg = [0] * num_courses\n    for a, b in prerequisites:\n        adj[b].append(a)\n\
  \        indeg[a] += 1\n    q = deque(i for i in range(num_courses) if indeg[i]\
  \ == 0)\n    taken = 0\n    while q:\n        u = q.popleft()\n        taken +=\
  \ 1\n        for v in adj[u]:\n            indeg[v] -= 1\n            if indeg[v]\
  \ == 0:\n                q.append(v)\n    return taken == num_courses\n"
