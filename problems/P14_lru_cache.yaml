id: P14
slug: lru-cache
title: LRU Cache (Prefix / KV Cache Eviction)
leetcode: 146
day: 1
pattern:
- hash_map
difficulty: medium
post_training_relevance: Directly models vLLM/SGLang prefix KV-cache block eviction
  under Least-Recently-Used policy.
statement: 'Simulate an LRU Cache of given `capacity` over a sequence of operations
  `ops`.

  Each op is either `["get", key]` (appends the returned value or `-1` to output)
  or `["put", key, value]` (appends `None` to output). Both `get` and `put` mark `key`
  as most-recently used.'
examples:
- input: capacity = 2, ops = [["put",1,1],["put",2,2],["get",1],["put",3,3],["get",2],["put",4,4],["get",1],["get",3],["get",4]]
  output: '[None, None, 1, None, -1, None, -1, 3, 4]'
constraints:
- 1 <= capacity <= 3000
function_name: run_lru_cache
starter_code: "from collections import OrderedDict\n\ndef run_lru_cache(capacity:\
  \ int, ops: list[list]) -> list:\n    pass\n"
tests:
- args:
  - 2
  - - - put
      - 1
      - 1
    - - put
      - 2
      - 2
    - - get
      - 1
    - - put
      - 3
      - 3
    - - get
      - 2
    - - put
      - 4
      - 4
    - - get
      - 1
    - - get
      - 3
    - - get
