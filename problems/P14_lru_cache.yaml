compare: exact
time_limit_ms: 2000
hints:
- In Python, `collections.OrderedDict` (or a dict + doubly linked list) supports O(1)
  `move_to_end(key)` and `popitem(last=False)`.
- Be prepared to explain how `OrderedDict` is implemented under the hood (hash map
  of nodes in a doubly-linked list).
optimal:
  time: O(1) per op
  space: O(capacity)
follow_ups:
- How would you implement this without `OrderedDict` using a custom `Node` class with
  `prev` and `next` pointers?
- In LLM prefix caching (RadixAttention), why do we evict leaf nodes of a radix tree
  in LRU order?
reference_solution: "from collections import OrderedDict\n\ndef run_lru_cache(capacity:\
  \ int, ops: list[list]) -> list:\n    cache = OrderedDict()\n    out = []\n    for\
  \ op in ops:\n        if op[0] == 'get':\n            k = op[1]\n            if\
  \ k not in cache:\n                out.append(-1)\n            else:\n         \
  \       cache.move_to_end(k)\n                out.append(cache[k])\n        else:\n\
  \            k, v = op[1], op[2]\n            if k in cache:\n                cache.move_to_end(k)\n\
  \            cache[k] = v\n            if len(cache) > capacity:\n             \
  \   cache.popitem(last=False)\n            out.append(None)\n    return out\n"
