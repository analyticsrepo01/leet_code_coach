id: M09
slug: sequence-packing
title: SFT Sequence Packing (First-Fit Decreasing)
leetcode: null
day: 2
pattern:
- heap
- greedy
difficulty: medium
post_training_relevance: Packing variable-length SFT/pretraining sequences into `max_seq_len`
  bins eliminates padding waste and maximizes GPU token throughput.
statement: 'Given a list of sequence token `lengths` (each `1 <= length <= max_len`)
  and integer `max_len`, pack the sequences using **First-Fit Decreasing (FFD)**:


  1. Sort `lengths` in **descending** order.

  2. Place each length into the **first existing bin** that has enough remaining capacity
  (`remaining >= length`), or open a new bin if none fits.


  Return `[bins, efficiency]` where `bins` is the list of bins (each a list of lengths)
  and `efficiency = round(sum(lengths) / (len(bins) * max_len), 6)`.'
examples:
- input: lengths = [4, 8, 1, 4, 2, 1], max_len = 10
  output: '[[[8, 2], [4, 4, 1, 1]], 1.0]'
constraints:
- 1 <= len(lengths) <= 10^4
- 1 <= lengths[i] <= max_len
function_name: pack_sequences
starter_code: "def pack_sequences(lengths: list[int], max_len: int) -> list:\n   \
  \ # Return [bins, round(efficiency, 6)]\n    pass\n"
