compare: exact
time_limit_ms: 2000
hints:
- 'Sort `lengths` in descending order: `sorted(lengths, reverse=True)`.'
- For each length `L`, scan existing bins for the first bin with `used + L <= max_len`;
  if found, append `L`, else create `[L]`.
optimal:
  time: O(n^2) or O(n log n) with segment tree
  space: O(n)
follow_ups:
- When we pack multiple SFT examples into a single context window, how must we modify
  the causal attention mask and RoPE position IDs so examples don't attend to each
  other?
reference_solution: "def pack_sequences(lengths: list[int], max_len: int) -> list:\n\
  \    items = sorted(lengths, reverse=True)\n    bins = []\n    used = []\n    for\
  \ x in items:\n        placed = False\n        for i in range(len(bins)):\n    \
  \        if used[i] + x <= max_len:\n                bins[i].append(x)\n       \
  \         used[i] += x\n                placed = True\n                break\n \
  \       if not placed:\n            bins.append([x])\n            used.append(x)\n\
  \    eff = round(sum(lengths) / (len(bins) * max_len), 6) if bins else 0.0\n   \
  \ return [bins, eff]\n"
