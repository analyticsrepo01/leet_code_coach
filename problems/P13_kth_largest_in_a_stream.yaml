id: P13
slug: kth-largest-in-a-stream
title: Kth Largest Element in a Stream
leetcode: 703
day: 1
pattern:
- heap
- streaming
difficulty: easy
post_training_relevance: Fixed-capacity min-heap of size k tracks top-k highest-reward
  rollouts in online RL without storing all trajectories.
statement: Given `k`, an initial list `initial`, and a list of incoming `stream` values,
  return a list containing the `k`-th largest element after each value in `stream`
  is added.
examples:
- input: k = 3, initial = [4, 5, 8, 2], stream = [3, 5, 10, 9, 4]
  output: '[4, 5, 5, 8, 8]'
constraints:
- 1 <= k <= 10^4
- len(initial) >= k - 1
function_name: kth_largest_stream
starter_code: "import heapq\n\ndef kth_largest_stream(k: int, initial: list[int],\
  \ stream: list[int]) -> list[int]:\n    pass\n"
tests:
- args:
  - 3
  - - 4
    - 5
    - 8
    - 2
  - - 3
    - 5
    - 10
    - 9
    - 4
  expected:
  - 4
  - 5
  - 5
  - 8
  - 8
hidden_tests:
- args:
  - 1
  - []
  - - -3
    - -2
    - -4
    - 0
    - 4
  expected:
  - -3
  - -2
  - -2
  - 0
  - 4
compare: exact
time_limit_ms: 2000
hints:
- Maintain a min-heap of size at most `k` holding the `k` largest elements seen so
  far.
- The root `heap[0]` is always the `k`-th largest element!
optimal:
  time: O((n + m) log k)
  space: O(k)
follow_ups:
- When is `heapq.heappushpop(heap, x)` faster than `heappush` followed by `heappop`?
reference_solution: "import heapq\n\ndef kth_largest_stream(k: int, initial: list[int],\
  \ stream: list[int]) -> list[int]:\n    heap = list(initial)\n    heapq.heapify(heap)\n\
  \    while len(heap) > k:\n        heapq.heappop(heap)\n    out = []\n    for x\
  \ in stream:\n        if len(heap) < k:\n            heapq.heappush(heap, x)\n \
  \       elif x > heap[0]:\n            heapq.heapreplace(heap, x)\n        out.append(heap[0])\n\
  \    return out\n"
