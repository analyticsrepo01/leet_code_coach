id: C10
slug: search-in-rotated-sorted-array
title: Search in Rotated Sorted Array
kind: coding
track: cs
leetcode: 33
day: 1
pattern:
- binary_search
difficulty: medium
post_training_relevance: Tests whether you truly understand binary search invariants
  beyond simple sorted arrays.
statement: 'There is an integer array `nums` sorted in ascending order (with **distinct**
  values). Prior to being passed to your function, `nums` is possibly rotated at an
  unknown pivot index.


  Given the array `nums` after the possible rotation and an integer `target`, return
  the index of `target` if it is in `nums`, or `-1` if it is not in `nums`.


  You must write an algorithm with $O(\log n)$ runtime complexity.'
examples:
- input: nums = [4,5,6,7,0,1,2], target = 0
  output: '4'
- input: nums = [4,5,6,7,0,1,2], target = 3
  output: '-1'
constraints:
- 1 <= len(nums) <= 5000
- All values of nums are unique.
function_name: search_rotated
starter_code: "def search_rotated(nums: list[int], target: int) -> int:\n    pass\n"
tests:
- args:
  - - 4
    - 5
    - 6
    - 7
    - 0
    - 1
    - 2
  - 0
  expected: 4
- args:
  - - 4
    - 5
    - 6
    - 7
    - 0
    - 1
    - 2
  - 3
  expected: -1
- args:
  - - 1
  - 0
  expected: -1
hidden_tests:
- args:
  - - 3
    - 1
  - 1
  expected: 1
- args:
  - - 5
    - 1
    - 3
  - 5
  expected: 0
compare: exact
time_limit_ms: 2000
hints:
- When you split a rotated sorted array at `mid`, AT LEAST ONE of the two halves `[lo..mid]`
  or `[mid..hi]` is guaranteed to be strictly sorted!
- Check if the left half is sorted via `if nums[lo] <= nums[mid]:`.
- If the left half is sorted, check whether `nums[lo] <= target < nums[mid]` to decide
  whether to go left (`hi = mid - 1`) or right (`lo = mid + 1`). Do the mirror check
  if the right half is sorted.
optimal:
  time: O(log n)
  space: O(1)
follow_ups:
- What breaks if `nums` is allowed to contain duplicates (LC 81), such as `[1, 0,
  1, 1, 1]`?
reference_solution: "def search_rotated(nums: list[int], target: int) -> int:\n  \
  \  lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n\
  \        if nums[mid] == target:\n            return mid\n        if nums[lo] <=\
  \ nums[mid]:\n            if nums[lo] <= target < nums[mid]:\n                hi\
  \ = mid - 1\n            else:\n                lo = mid + 1\n        else:\n  \
  \          if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n  \
  \          else:\n                hi = mid - 1\n    return -1\n"
