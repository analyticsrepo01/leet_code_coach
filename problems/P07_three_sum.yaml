compare: exact
time_limit_ms: 2000
hints:
- Sort `nums` first in O(n log n). If `nums[i] > 0`, can any triplet starting at `i`
  sum to 0?
- For each fixed `i` (skipping duplicates `nums[i] == nums[i-1]`), run two pointers
  `lo = i + 1` and `hi = n - 1`.
- When a match is found, advance both pointers and skip duplicate values.
optimal:
  time: O(n^2)
  space: O(1) extra
follow_ups:
- How would you adapt this to 3Sum Closest (minimizing `|a + b + c - target|`)?
reference_solution: "def three_sum(nums: list[int]) -> list[list[int]]:\n    nums\
  \ = sorted(nums)\n    n = len(nums)\n    res = []\n    for i in range(n - 2):\n\
  \        if nums[i] > 0:\n            break\n        if i > 0 and nums[i] == nums[i\
  \ - 1]:\n            continue\n        lo, hi = i + 1, n - 1\n        while lo <\
  \ hi:\n            s = nums[i] + nums[lo] + nums[hi]\n            if s < 0:\n  \
  \              lo += 1\n            elif s > 0:\n                hi -= 1\n     \
  \       else:\n                res.append([nums[i], nums[lo], nums[hi]])\n     \
  \           lo += 1\n                hi -= 1\n                while lo < hi and\
  \ nums[lo] == nums[lo - 1]:\n                    lo += 1\n                while\
  \ lo < hi and nums[hi] == nums[hi + 1]:\n                    hi -= 1\n    return\
  \ res\n"
