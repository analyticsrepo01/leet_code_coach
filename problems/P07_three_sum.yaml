id: P07
slug: three-sum
title: 3Sum (Unique Zero-Sum Triplets)
leetcode: 15
day: 1
pattern:
- two_pointers
difficulty: medium
post_training_relevance: Sorting + two-pointer deduplication tests careful index invariant
  management without hash-table overhead.
statement: 'Given an integer array `nums`, return all unique triplets `[nums[i], nums[j],
  nums[k]]` (`i != j != k`) such that `nums[i] + nums[j] + nums[k] == 0`.


  Return the triplets sorted in ascending order (both within each triplet and across
  the list of triplets).'
examples:
- input: nums = [-1, 0, 1, 2, -1, -4]
  output: '[[-1, -1, 2], [-1, 0, 1]]'
- input: nums = [0, 0, 0]
  output: '[[0, 0, 0]]'
constraints:
- 3 <= len(nums) <= 3000
- -10^5 <= nums[i] <= 10^5
function_name: three_sum
starter_code: "def three_sum(nums: list[int]) -> list[list[int]]:\n    pass\n"
tests:
