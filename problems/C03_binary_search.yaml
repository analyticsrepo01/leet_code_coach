id: C03
slug: binary-search
title: Binary Search
kind: coding
track: cs
leetcode: 704
day: 1
pattern:
- binary_search
difficulty: easy
post_training_relevance: The most important O(log n) search template in computer science
  — used everywhere from sorted arrays to bisecting thresholds.
statement: 'Given an array of integers `nums` which is sorted in ascending order,
  and an integer `target`, write a function to search `target` in `nums`. If `target`
  exists, then return its index. Otherwise, return `-1`.


  You must write an algorithm with $O(\log n)$ runtime complexity.'
examples:
- input: nums = [-1,0,3,5,9,12], target = 9
  output: '4'
  explanation: 9 exists in nums and its index is 4.
- input: nums = [-1,0,3,5,9,12], target = 2
  output: '-1'
  explanation: 2 does not exist in nums so return -1.
constraints:
- 1 <= len(nums) <= 10^4
- All integers in nums are unique and sorted in ascending order.
function_name: binary_search
starter_code: "def binary_search(nums: list[int], target: int) -> int:\n    # Maintain\
  \ [lo, hi] search interval\n    pass\n"
