compare: exact
time_limit_ms: 2000
hints:
- Initialize `lo = 0` and `hi = len(nums) - 1` so both endpoints are inclusive.
- In a `while lo <= hi:` loop, compute `mid = (lo + hi) // 2`.
- If `nums[mid] < target`, the answer must be to the right (`lo = mid + 1`). If `nums[mid]
  > target`, it must be to the left (`hi = mid - 1`).
optimal:
  time: O(log n)
  space: O(1)
follow_ups:
- How would you modify this to find the FIRST occurrence (`bisect_left`) if `nums`
  contained duplicates?
- Why do languages with fixed 32-bit integers write `lo + (hi - lo) // 2` instead
  of `(lo + hi) // 2`?
reference_solution: "def binary_search(nums: list[int], target: int) -> int:\n   \
  \ lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n\
  \        if nums[mid] == target:\n            return mid\n        elif nums[mid]\
  \ < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n\
  \    return -1\n"
