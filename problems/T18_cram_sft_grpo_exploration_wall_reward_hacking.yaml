hints:
  - "For the Exploration Wall: write out a 4-rollout group where 0 answers emit a directive. With bonus B in {1, 3, 5}, the directive reward vector is [0, 0, 0, 0], mean = 0, advantage = [0, 0, 0, 0]. No gradient flows toward directive tokens until at least 1 rollout in the group emits a directive."
  - "For Why SFT Failed: highlight three root causes from §3.5: (1) all 156 Claude-generated examples only used [KEEP] (zero examples of COMPRESS, EVICT, REFOCUS), (2) loss stayed flat (2.06 -> 2.04 -> 2.06), and (3) format score remained -0.18 in GRPO-after-SFT, pointing to chat-template mismatch or under-training the 0.069% adapter."
  - "For Reward Hacking: contrast 'bag-of-tags' (`tag in output`, easily hacked to 1.0 by listing all 4 tags) vs 'per-block Macro-F1' (parse block -> directive and average F1 equally across KEEP, COMPRESS, EVICT, REFOCUS, which exposed the 89% fixed-template habit at 0.145 Macro-F1)."

