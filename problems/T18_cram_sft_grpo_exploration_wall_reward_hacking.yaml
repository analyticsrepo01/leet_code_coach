post_training_relevance: "Direct interview prep for your CRAM (Context-Rational Agentic Memory) SFT + GRPO project: QLoRA (Gemma 4-E4B-it, NF4, r=8/α=16), the 4 memory directives ([KEEP], [COMPRESS], [EVICT], [REFOCUS]) + <shield>, the Exploration Wall across 12 runs, and fixing the SAMB bag-of-tags reward-hacking bug with per-block Macro-F1."
statement: |
  **CRAM ("Context-Rational Agentic Memory") — SFT & GRPO Interview Prep Deep-Dive**

  📄 **Attached HTML Study Guides:**
  - **[CRAM: SFT and GRPO, in plain English (2-Page Cheat Sheet)](/materials/interview-sft-grpo-explainer.html)**
  - **[CRAM: SFT and GRPO, explained properly (Full 12-Section Guide)](/materials/interview-sft-grpo-explained.html)**

  ---

  ### Interview Prompt
  In your technical interview, be ready to walk through your **CRAM SFT + GRPO** experiments clearly, honestly, and quantitatively across these **5 core areas**:

  1. **The Problem & Model Setup (QLoRA on 1 H100):**
     - What problem does **CRAM** solve for long-horizon agents, what are the **4 memory directives** (`[KEEP]`, `[COMPRESS]`, `[EVICT]`, `[REFOCUS]`) and **`<shield>`** tags across the 156 multi-step tasks?
     - How did you configure **`google/gemma-4-E4B-it`** with **4-bit NF4 double quantization** and **LoRA ($r=8, \alpha=16$, 5.5M trainable params = 0.069%)** + 8-bit AdamW to fit in ~23 GB on one H100?

  2. **The SFT Stage & Why It Didn't Break the Wall:**
     - How were the **156 gold SFT examples** generated (`train_sft_v1.py`, 3 epochs, `lr=2e-4`, 114 steps, batch $1 \times 4$ grad accum), what happened to the cross-entropy loss (`2.06 → 2.04 → 2.06`), and what critical flaw existed in the 156 gold examples (all 156 only used `[KEEP]`, and format score stayed ~`-0.18`)?

  3. **The GRPO Stage, Composite Reward & Why `KL = 0.0`:**
     - Explain **GRPO** ($G=4$ rollouts per task, grad accum 4 = 16 rollouts/update, no critic network, advantage $A_i = R_i - \bar{R}$, no PPO $\epsilon$-clip, grad clip 1.0) vs. PPO and DPO.
     - Break down the **5-part reward**: **Format** ($+0.1$ `<think>`, $+0.1$ `<answer>`, $-0.2$ if neither), **Task** ($0..+1$ keyword share), **Directive** ($+1/+3/+5$), **Shield** ($+1$ all kept, $-2$ per dropped shield), and **Thrift** ($0..-1$ over 150 words).
     - How was the KL reference computed (`model.disable_adapter()`, $\beta=0.04$), why did the logs show **`KL = 0.0`** at every step, and what does that imply?

  4. **The Central Finding — The Exploration Wall Across All 12 Runs:**
     - Why did raising the directive bonus from **$+1 \to +3 \to +5$** fail to increase directive usage (`0.3% → 1.3% → 1.3%`)? Explain mathematically using the group advantage $A_i = R_i - \bar{R}$.
     - Why did changing one word in the prompt (**`"may"` $\to$ `"must"`**, Run 6) immediately unlock directives from **step 2** (`7.0%` usage, best `roll20 = +0.277`), and what happened in the **Curriculum run** (Run 10: 100 steps `"must"` at `9.2%` $\to$ 100 steps `"may"` dropping back to `0.5%`)?

  5. **The SAMB Reward-Hacking Story & What You Would Do Next:**
     - Explain how the original **SAMB** evaluator ("bag of tags" substring check) could be gamed to score **1.0 on every metric** by printing all four tags, how you fixed it with **per-block parsing + Macro-F1**, and what the honest post-fix numbers revealed on Gemma 4 31B (`24.9%` accuracy = chance, `0.145` Macro-F1, `139/156 = 89%` emitting identical `KEEP, COMPRESS, EVICT, KEEP`).
     - List the **4 concrete improvements** you would make in the next iteration.

examples:
  - input: "\"Why didn't raising the directive reward from +1 to +3 to +5 fix the exploration wall?\""
    output: "\"GRPO compares the 4 answers it actually sampled in a group. If none of the 4 rollouts contains a directive, all 4 get 0 directive reward, so the group mean is 0 and every advantage is 0. Multiplying 0 by +5 is still 0. Only changing what the model tries ('must' prompt) seeded directives into the group from step 2.\""
    explanation: "Zero within-group variance yields zero policy gradient signal regardless of reward scale."
  - input: "\"Tell me about a time your evaluation metric misled you (Reward Hacking).\""
    output: "\"My first SAMB evaluator checked if the gold tag appeared anywhere in the output ('bag of tags'). Printing all 4 tags scored 1.0 on every metric. After switching to per-block parsing and 4-class Macro-F1, Gemma 4 31B scored 24.9% accuracy (chance is 25%) and 0.145 Macro-F1 because 89% of outputs repeated KEEP, COMPRESS, EVICT, KEEP regardless of content.\""
    explanation: "Directly addresses reward hacking and evaluator validation."

constraints:
  - "Cite exact numbers from the CRAM repo logs (156 tasks, 11 shielded, LoRA r=8/alpha=16 = 5.5M params / 0.069%, G=4, 12 runs, roll20 +0.277 on 'must', 0.145 Macro-F1)."
  - "Be candid about what didn't work (SFT loss flat at ~2.05 with only [KEEP], KL measured 0.0, no G sweep, no forgetting benchmark) and how you diagnosed each issue."

