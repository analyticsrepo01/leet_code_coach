rubric_points:
  - "Problem & QLoRA Setup: Clearly explains Context-Rational Agentic Memory (CRAM), the 4 directives ([KEEP], [COMPRESS], [EVICT], [REFOCUS]) + <shield> on 156 tasks (11 shielded), and QLoRA on Gemma 4-E4B-it (4-bit NF4 + double quant, LoRA r=8, alpha=16, 5.5M params = 0.069%, ~23 GB on 1 H100)."
  - "SFT Diagnosis: Explains why SFT failed to seed directive habits — 156 examples only contained [KEEP], cross-entropy loss stayed flat (2.06 -> 2.04 -> 2.06), format score stayed ~ -0.18, and task reward dropped from ~0.36 to ~0.21."
  - "GRPO Mechanics & KL=0.0: Explains G=4 group baseline (advantage = score - group mean, summing to 0, no critic network, no PPO ratio clip, grad clip 1.0), the 5-part reward (Format + Task + Directive + Shield + Thrift), and why KL via disable_adapter() logged 0.0."
  - "The Exploration Wall (12 Runs): Articulates why +1/+3/+5 reward bonuses all stayed at 0.3%-1.3% (zero within-group variance = zero advantage), why 'must' unlocked learning from step 2 (7.0% usage, roll20 +0.277), and why the curriculum habit vanished (9.2% -> 0.5%) when switching from 'must' to 'may'."
  - "Reward-Hacking & Next Steps: Explains the SAMB bag-of-tags bug (printing all 4 tags scored 1.0), the per-block Macro-F1 fix (exposing 24.9% accuracy / 0.145 F1 and 89% fixed KEEP, COMPRESS, EVICT, KEEP pattern), and the 4 concrete next steps."

follow_ups:
  - "Why didn't raising the directive reward from +1 to +3 to +5 fix the exploration wall?"
  - "How did you pick group size G = 4, and how would sweeping G = 8 or 16 affect the exploration wall?"
  - "Why was KL divergence 0.0 at every step of every run, and how would you verify the adapter weights actually moved?"
  - "How do you know the model didn't forget general capabilities during SFT or GRPO?"
  - "What surprised you most across all 12 runs, and what 4 changes would you make next?"

reference_solution: |
  # ============================================================================
  # CRAM: SFT & GRPO INTERVIEW PREP — GOLD "SAY IT LIKE THIS" ANSWERS
  # ============================================================================

  # 1. THE PROBLEM & QLORA SETUP
  # "Agents forget the one detail they need because their memory is a fixed-size
  # window. In CRAM (Context-Rational Agentic Memory), I tried to teach a small
  # model (Gemma 4-E4B-it) to label context blocks with four directives —
  # [KEEP], [COMPRESS], [EVICT], [REFOCUS] — and never drop critical facts wrapped
  # in <shield>...</shield> across 156 multi-step tasks (11 shielded).
  # I trained only ~5.5M parameters (LoRA r=8, alpha=16, 0.069% of weights) on top
  # of 4-bit NF4 double-quantized weights with 8-bit AdamW, fitting each run in
  # ~23 GB on a single H100."

  # 2. WHY SFT DIDN'T TAKE
  # "My SFT didn't take: cross-entropy loss stayed flat around 2.05 (2.06 -> 2.04 -> 2.06)
  # over 3 epochs (114 steps, lr 2e-4), and the 156 Claude-generated gold answers
  # only ever used [KEEP] — zero examples of COMPRESS, EVICT, or REFOCUS. Even
  # <think>/<answer> format scores stayed at -0.18 in the subsequent GRPO run.
  # The lesson is that demonstrations must be balanced across all target actions,
  # and you must verify loss decreases and behavior shifts before starting RL."

  # 3. GRPO MECHANICS, REWARD & WHY KL = 0.0
  # "GRPO is RL without a critic. For each task, the model samples G = 4 answers,
  # deterministic Python code scores them (Format + Task keywords + Directive +
  # Shield + Thrift length penalty), and each answer's advantage is its score minus
  # the group mean (summing to zero). We used gradient accumulation 4 (16 rollouts
  # per update), gradient clipping 1.0, no PPO ratio clipping, and computed reference
  # log-probs via model.disable_adapter() with KL beta = 0.04. Notably, logged KL
  # was 0.0 at every step, indicating the 0.069% adapter barely moved and behavior
  # changes came primarily from prompt conditioning."

  # 4. THE EXPLORATION WALL (CENTRAL FINDING ACROSS 12 RUNS)
  # "The biggest lesson was the exploration wall: RL can only reinforce a behavior
  # that already happens sometimes. If none of the 4 rollouts in a group emits a
  # directive, all 4 get 0 directive bonus, the group average is 0, and the
  # advantage difference is 0. Raising the bonus from +1 to +3 to +5 multiplied zero
  # (usage stayed at 0.3% -> 1.3% -> 1.3%). One word in the prompt — 'must' instead
  # of 'may' (Run 6) — seeded directives from step 2 (7.0% usage, best roll20 +0.277).
  # In the 200-step Curriculum run (100 'must' -> 100 'may'), usage dropped from
  # 9.2% back to 0.5% as soon as forcing stopped."

  # 5. REWARD HACKING (SAMB EVALUATOR BUG) & NEXT STEPS
  # "My first SAMB evaluator checked whether the gold tag appeared anywhere in the
  # output ('bag of tags'), which could be beaten to score 1.0 by printing all 4 tags.
  # After fixing the grader to parse block -> directive and compute 4-class Macro-F1,
  # Gemma 4 31B scored 24.9% accuracy (chance is 25%) and 0.145 Macro-F1 because
  # 139 of 156 outputs (89%) repeated the fixed sequence KEEP, COMPRESS, EVICT, KEEP
  # regardless of content.
  # Next steps: (1) Balanced block-labelled gold SFT data across all 4 directives,
  # (2) Verify SFT chat template & falling loss before RL, (3) Reward per-block
  # Macro-F1 in GRPO with larger group size G (8-16) and mixed must/may prompts,
  # and (4) Verify non-zero KL and track a held-out forgetting benchmark."

