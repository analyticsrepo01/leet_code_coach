id: C20
slug: word-break
title: Word Break
kind: coding
track: cs
leetcode: 139
day: 1
pattern:
- dynamic_programming
- strings
- hash_map
difficulty: medium
post_training_relevance: Directly mirrors subword tokenization / lattice segmentation
  in NLP & LLM tokenizers.
statement: 'Given a string `s` and a dictionary of strings `word_dict`, return `True`
  if `s` can be segmented into a space-separated sequence of one or more dictionary
  words.


  Note that the same word in the dictionary may be reused multiple times in the segmentation.'
examples:
- input: s = "leetcode", word_dict = ["leet","code"]
  output: 'True'
- input: s = "applepenapple", word_dict = ["apple","pen"]
  output: 'True'
- input: s = "catsandog", word_dict = ["cats","dog","sand","and","cat"]
  output: 'False'
constraints:
- 1 <= len(s) <= 300
- 1 <= len(word_dict) <= 1000
function_name: word_break
starter_code: "def word_break(s: str, word_dict: list[str]) -> bool:\n    pass\n"
tests:
- args:
  - leetcode
  - - leet
    - code
  expected: true
- args:
  - applepenapple
  - - apple
    - pen
  expected: true
- args:
  - catsandog
  - - cats
    - dog
    - sand
    - and
    - cat
  expected: false
hidden_tests:
- args:
  - aaaaaaa
  - - aaaa
    - aaa
  expected: true
compare: exact
time_limit_ms: 2000
hints:
- Convert `word_dict` into a `set` for $O(1)$ lookups.
- Define boolean `dp[i]` = whether prefix `s[:i]` can be segmented into valid dictionary
  words, with base case `dp[0] = True`.
- '`dp[i]` is `True` if there exists any `j < i` where `dp[j]` is `True` AND `s[j:i]
  in word_set`.'
optimal:
  time: O(n^2)
  space: O(n)
follow_ups:
- How does replacing the inner loop over `j` with a Trie reduce the lookup cost when
  dictionary words have bounded length $L$?
reference_solution: "def word_break(s: str, word_dict: list[str]) -> bool:\n    word_set\
  \ = set(word_dict)\n    n = len(s)\n    dp = [False] * (n + 1)\n    dp[0] = True\n\
  \    for i in range(1, n + 1):\n        for j in range(i):\n            if dp[j]\
  \ and s[j:i] in word_set:\n                dp[i] = True\n                break\n\
  \    return dp[n]\n"
