id: T10
slug: quant-probability-quickies
title: 'Theory: Quant Probability Warm-Ups (Order Stats, Gambler''s Ruin, Coupon Collector)'
kind: theory
track: theory
day: 2
pattern:
- probability
- theory
difficulty: medium
post_training_relevance: Quick probability derivations frequently appear in the last
  10 minutes of quant ML research phone screens.
statement: 'Derive the answers to these four classic probability questions out loud:

  1. **Order statistics:** Given $X_1, \dots, X_n \stackrel{\text{i.i.d.}}{\sim} \text{Uniform}(0,
  1)$, find the CDF, PDF, and expected value $\mathbb{E}[\max_i X_i]$.

  2. **Gambler''s Ruin:** Starting at $k$ dollars with fair $\pm 1$ coin flips, what
  is the probability of reaching $N$ before $0$, and what is the expected number of
  steps until absorption?

  3. **Coupon Collector:** Expected number of draws to collect all $n$ distinct coupons.

  4. **Noisy Bayes:** A rare regime occurs $1\%$ of the time; a detector has $99\%$
  sensitivity and $99\%$ specificity. Given a positive alert, what is the posterior
  probability?'
hints:
- For $\max_i X_i$, $P(\max_i X_i \le x) = x^n$, or use symmetry of $n$ points partitioning
  $[0,1]$ into $n+1$ equal segments on the circle!
rubric_points:
- Derives E[max(U_1..U_n)] = n / (n + 1) via CDF F(x) = x^n or symmetry.
- States Gambler's Ruin fair absorption probability k / N and expected time k * (N
  - k) via martingales (X_t and X_t^2 - t).
- Derives Coupon Collector E[T] = n * H_n ~ n log n by decomposing into geometric
  waiting times.
- Computes Bayes posterior 0.01*0.99 / (0.01*0.99 + 0.99*0.01) = 50%.
follow_ups:
- What is the expected value of the k-th smallest of n i.i.d. Uniform(0,1) variables?
  (`k / (n + 1)` — Beta(k, n - k + 1) distribution).
reference_solution: '1. F_max(x) = x^n, f(x) = n x^(n-1), E[max] = int_0^1 x * n x^(n-1)
  dx = n/(n+1).

  2. By Optional Stopping on martingale M_t = X_t, P(hit N) = k/N. By martingale X_t^2
  - t, E[T] = k(N - k).

  3. Waiting time after having j coupons is Geom((n-j)/n); sum E[T_j] = n * sum_{m=1}^n
  (1/m) = n H_n.

  4. Posterior = (0.01 * 0.99) / (0.01 * 0.99 + 0.99 * 0.01) = 0.5.'
