id: C04
slug: climbing-stairs
title: Climbing Stairs
kind: coding
track: cs
leetcode: 70
day: 1
pattern:
- dynamic_programming
difficulty: easy
post_training_relevance: 'The gateway problem to Dynamic Programming: recognizing
  overlapping subproblems and reducing O(n) state to O(1) space.'
statement: 'You are climbing a staircase. It takes `n` steps to reach the top.


  Each time you can either climb `1` or `2` steps. In how many distinct ways can you
  climb to the top?'
examples:
- input: n = 2
  output: '2'
  explanation: '1. 1 step + 1 step

    2. 2 steps'
- input: n = 3
  output: '3'
  explanation: '1. 1+1+1

    2. 1+2

    3. 2+1'
constraints:
- 1 <= n <= 45
function_name: climb_stairs
starter_code: "def climb_stairs(n: int) -> int:\n    # How does ways(n) relate to\
  \ ways(n-1) and ways(n-2)?\n    pass\n"
tests:
- args:
  - 2
  expected: 2
- args:
  - 3
  expected: 3
- args:
  - 5
  expected: 8
hidden_tests:
- args:
  - 1
  expected: 1
- args:
  - 10
  expected: 89
- args:
  - 20
  expected: 10946
compare: exact
time_limit_ms: 2000
hints:
- To reach step `i`, your very last move must have been either a 1-step from `i-1`
  or a 2-step from `i-2`.
- That means `dp[i] = dp[i-1] + dp[i-2]` — the Fibonacci recurrence!
- Instead of an array of size `n`, you only need two variables `prev2, prev1 = 1,
  1`.
optimal:
  time: O(n)
  space: O(1)
follow_ups:
- Why is naive recursion `climb(n-1) + climb(n-2)` without memoization $O(2^n)$?
- Can this recurrence be solved in $O(\log n)$ time using $2 \times 2$ matrix exponentiation?
reference_solution: "def climb_stairs(n: int) -> int:\n    if n <= 2:\n        return\
  \ n\n    a, b = 1, 2\n    for _ in range(3, n + 1):\n        a, b = b, a + b\n \
  \   return b\n"
