post_training_relevance: 'Grounded in Stanford CME 295 Transformers & LLMs VIP Cheatsheet (Sections 3.1 & 3.2): implements sparse Mixture-of-Experts (MoE) top-k token routing y_hat = sum_i G(x)_i E_i(x) and temperature-scaled softmax decoding p_i = exp(x_i/T) / sum_j exp(x_j/T).'
statement: |
  In **Stanford CME 295 (Transformers & Large Language Models VIP Cheatsheet, Sections 3.1 & 3.2)**, modern frontier LLMs (such as DeepSeek, Mixtral, and GPT-class models) combine two core mechanisms:

  1. **Sparse Mixture of Experts (MoE)** in Feed-Forward layers:
     Instead of activating every FFN parameter for every token, a router gate $G(x)$ selects the **top-$k$** experts out of $n$ experts $E_1, \dots, E_n$:
     $$\hat{y} = \sum_{i \in \text{TopK}(r)} G(x)_i \, E_i(x)$$
     where $r \in \mathbb{R}^n$ are the router logits for token $x$, and $G(x)_i$ is the **softmax normalized exclusively over the top-$k$ router logits** (with $G(x)_i = 0$ for all non-selected experts, breaking ties by **smaller expert index**).

  2. **Temperature-Scaled Decoding** (`sampling_probs`):
     Given next-token logits $z \in \mathbb{R}^V$ and temperature $T > 0$, the sampling distribution is:
     $$p_i = \frac{\exp(z_i / T)}{\sum_{j=1}^{V} \exp(z_j / T)}$$

  ### Task
  Implement `moe_layer_and_temperature(router_logits, expert_outputs, k, next_token_logits, temperature)` in Python / NumPy and return `[active_experts, gate_weights, moe_output, sampling_probs]` where floats are rounded to 6 decimal places.
examples:
- input: router_logits = [2.0, 0.5, 3.0, -1.0], expert_outputs = [[1.0, 0.0], [0.0, 1.0], [2.0, 4.0], [10.0, 10.0]], k = 2, next_token_logits = [1.0, 2.0, 0.0], temperature = 0.5
  output: '[[0, 2], [0.268941, 0.0, 0.731059, 0.0], [1.731059, 2.924234], [0.11731, 0.866813, 0.015876]]'
  explanation: 'Top-2 experts are indices 2 (logit 3.0) and 0 (logit 2.0). Softmax over [2.0, 3.0] gives [0.268941, 0.731059].'
constraints:
- 1 <= k <= n <= 64
- 1 <= d_model, V <= 512
- temperature > 0
