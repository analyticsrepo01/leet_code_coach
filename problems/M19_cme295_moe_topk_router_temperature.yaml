reference_solution: |
  import math

  def moe_layer_and_temperature(
      router_logits: list[float],
      expert_outputs: list[list[float]],
      k: int,
      next_token_logits: list[float],
      temperature: float,
  ):
      n = len(router_logits)
      d_model = len(expert_outputs[0]) if expert_outputs else 0

      # 1. Select Top-K experts (tie-break by smaller index)
      ranked_indices = sorted(range(n), key=lambda i: (-router_logits[i], i))
      active_experts = sorted(ranked_indices[:k])

      # 2. Compute numerically stable softmax over the Top-K router logits
      max_r = max(router_logits[i] for i in active_experts)
      exp_r = {i: math.exp(router_logits[i] - max_r) for i in active_experts}
      sum_exp_r = sum(exp_r.values())

      gate_weights = [0.0] * n
      for i in active_experts:
          gate_weights[i] = exp_r[i] / sum_exp_r

      # 3. Compute weighted sum of active expert outputs: y_hat = sum_i G(x)_i E_i(x)
      moe_out = [0.0] * d_model
      for i in active_experts:
          w = gate_weights[i]
          e_vec = expert_outputs[i]
          for d in range(d_model):
              moe_out[d] += w * e_vec[d]

      # 4. Compute temperature-scaled softmax over next_token_logits
      scaled_logits = [z / temperature for z in next_token_logits]
      max_z = max(scaled_logits)
      exp_z = [math.exp(z - max_z) for z in scaled_logits]
      sum_exp_z = sum(exp_z)
      sampling_probs = [round(val / sum_exp_z, 6) for val in exp_z]

      return [
          active_experts,
          [round(w, 6) for w in gate_weights],
          [round(v, 6) for v in moe_out],
          sampling_probs,
      ]
