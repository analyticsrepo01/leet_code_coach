hints:
  - "For GRPO rewards & advantages: `rewards = [b + (directive_bonus if has_dir else 0.0) for b, has_dir in zip(base_scores, rollout_directives)]`, then subtract `mean_r = sum(rewards) / len(rewards)` from each reward."
  - "For `directive_advantage_spread`: compute `dir_bonuses = [directive_bonus if d else 0.0 for d in rollout_directives]` and take `max(dir_bonuses) - min(dir_bonuses)`."
  - "For 4-class Macro-F1: loop over `c in ['KEEP', 'COMPRESS', 'EVICT', 'REFOCUS']`, count `tp`, `fp`, `fn` across `zip(gold_blocks, pred_blocks)`, compute `f1 = (2 * tp) / (2 * tp + fp + fn)` if the denominator > 0 else `0.0`, and average across the 4 classes."

optimal:
  time: "O(G + N)"
  space: "O(G)"

follow_ups:
  - "Why do the group advantages always sum to 0.0 in GRPO, and why does CRAM use `score - group_mean` without dividing by `group_std` when all 4 rollouts have identical directive scores?"
  - "In your SAMB evaluation of Gemma 4 31B across 156 samples, why did 89% (139/156) of outputs emit the fixed sequence KEEP, COMPRESS, EVICT, KEEP, and why did Macro-F1 drop to 0.145?"

reference_solution: |
  from typing import Any

  def evaluate_cram_grpo_and_samb(
      rollout_directives: list[bool],
      base_scores: list[float],
      directive_bonus: float,
      gold_blocks: list[str],
      pred_blocks: list[str],
  ) -> dict[str, Any]:
      dir_contribs = [directive_bonus if d else 0.0 for d in rollout_directives]
      rewards = [b + dc for b, dc in zip(base_scores, dir_contribs)]
      mean_r = sum(rewards) / len(rewards)
      advantages = [r - mean_r for r in rewards]
      spread = max(dir_contribs) - min(dir_contribs)

      bag_hacked = set(gold_blocks).issubset(set(pred_blocks))
      n = len(gold_blocks)
      acc = sum(1 for g, p in zip(gold_blocks, pred_blocks) if g == p) / n

      classes = ["KEEP", "COMPRESS", "EVICT", "REFOCUS"]
      f1_sum = 0.0
      for c in classes:
          tp = sum(1 for g, p in zip(gold_blocks, pred_blocks) if g == c and p == c)
          fp = sum(1 for g, p in zip(gold_blocks, pred_blocks) if g != c and p == c)
          fn = sum(1 for g, p in zip(gold_blocks, pred_blocks) if g == c and p != c)
          denom = 2 * tp + fp + fn
          f1_sum += (2.0 * tp / denom) if denom > 0 else 0.0

      macro_f1 = f1_sum / len(classes)
      return {
          "rewards": [round(x, 4) for x in rewards],
          "advantages": [round(x, 4) for x in advantages],
          "directive_advantage_spread": round(spread, 4),
          "bag_of_tags_hacked": bool(bag_hacked),
          "block_accuracy": round(acc, 4),
          "macro_f1": round(macro_f1, 4),
      }

