id: C07
slug: flood-fill
title: Flood Fill
kind: coding
track: cs
leetcode: 733
day: 1
pattern:
- graphs_bfs_dfs
difficulty: easy
post_training_relevance: Friendly introduction to 2D grid traversal using DFS or BFS
  — the foundation for all graph and matrix problems.
statement: 'You are given an `m x n` integer grid `image` where `image[i][j]` represents
  the pixel value of the image. You are also given three integers `sr`, `sc`, and
  `color`. Perform a **flood fill** on the image starting from the pixel `image[sr][sc]`:


  Replace the starting pixel''s color and all 4-directionally connected pixels of
  the **same original color** with `color`, and return the modified `image`.'
examples:
- input: image = [[1,1,1],[1,1,0],[1,0,1]], sr = 1, sc = 1, color = 2
  output: '[[2,2,2],[2,2,0],[2,0,1]]'
- input: image = [[0,0,0],[0,0,0]], sr = 0, sc = 0, color = 0
  output: '[[0,0,0],[0,0,0]]'
constraints:
- 1 <= m, n <= 50
- 0 <= sr < m, 0 <= sc < n
function_name: flood_fill
starter_code: "def flood_fill(image: list[list[int]], sr: int, sc: int, color: int)\
  \ -> list[list[int]]:\n    pass\n"
