compare: exact
time_limit_ms: 2000
hints:
- Record `orig = image[sr][sc]`. Watch out for the edge case where `orig == color`
  — if you don't return early, what happens?
- If `orig == color`, nothing changes (and DFS would loop infinitely without a visited
  set!), so return `image` immediately.
- Otherwise, run DFS/BFS from `(sr, sc)`, recoloring each cell with `orig` to `color`
  and visiting `(r+1,c), (r-1,c), (r,c+1), (r,c-1)`.
optimal:
  time: O(m * n)
  space: O(m * n)
follow_ups:
- Why does changing `image[r][c] = color` act as your `visited` marker so LONG as
  `orig != color`?
reference_solution: "def flood_fill(image: list[list[int]], sr: int, sc: int, color:\
  \ int) -> list[list[int]]:\n    orig = image[sr][sc]\n    if orig == color:\n  \
  \      return image\n    m, n = len(image), len(image[0])\n    def dfs(r: int, c:\
  \ int) -> None:\n        if r < 0 or r >= m or c < 0 or c >= n or image[r][c] !=\
  \ orig:\n            return\n        image[r][c] = color\n        dfs(r + 1, c)\n\
  \        dfs(r - 1, c)\n        dfs(r, c + 1)\n        dfs(r, c - 1)\n    dfs(sr,\
  \ sc)\n    return image\n"
