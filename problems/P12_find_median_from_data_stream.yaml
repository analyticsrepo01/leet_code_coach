id: P12
slug: find-median-from-data-stream
title: Streaming Median (Two Heaps)
leetcode: 295
day: 1
pattern:
- heap
- streaming
difficulty: hard
post_training_relevance: 'High-frequency quant & ML interview classic: maintaining
  online order statistics (median reward / latency) in O(log n) per update.'
statement: 'Given a stream of numbers `nums`, return a list of floats where the `i`-th
  element is the **running median** of `nums[:i+1]`.


  Implement this using the **two-heap** (`low` max-heap and `high` min-heap) pattern
  so each insertion runs in `O(log n)` time.'
examples:
- input: nums = [1, 2, 3]
  output: '[1.0, 1.5, 2.0]'
- input: nums = [5, 15, 1, 3]
  output: '[5.0, 10.0, 5.0, 4.0]'
constraints:
- 1 <= len(nums) <= 5 * 10^4
- -10^5 <= nums[i] <= 10^5
function_name: streaming_median
starter_code: "import heapq\n\ndef streaming_median(nums: list[float]) -> list[float]:\n\
  \    # Maintain two heaps: low (max-heap via negation) and high (min-heap)\n   \
  \ pass\n"
tests:
- args:
  - - 1
    - 2
    - 3
  expected:
  - 1.0
  - 1.5
  - 2.0
- args:
  - - 5
    - 15
    - 1
    - 3
  expected:
  - 5.0
  - 10.0
  - 5.0
  - 4.0
hidden_tests:
- args:
  - - -1
    - -2
    - -3
    - -4
    - -5
  expected:
  - -1.0
  - -1.5
  - -2.0
  - -2.5
  - -3.0
compare: float_tol
time_limit_ms: 2000
hints:
- 'Maintain two heaps: `low` (a max-heap of the smaller half, using negated values
  in `heapq`) and `high` (a min-heap of the larger half).'
- 'Invariant 1: every element in `low` <= every element in `high`.'
- 'Invariant 2: `len(low) == len(high)` or `len(low) == len(high) + 1`.'
- 'To insert `x`: push `-x` to `low`, pop the largest from `low` and push to `high`;
  if `len(high) > len(low)`, pop from `high` back to `low`.'
optimal:
  time: O(n log n)
  space: O(n)
follow_ups:
- What if all stream values are integers in `[0, 100]`? How about if 99% are in `[0,
  100]`?
- How would you support sliding-window median (removing old elements)?
reference_solution: "import heapq\n\ndef streaming_median(nums: list[float]) -> list[float]:\n\
  \    low = []   # max-heap (negated)\n    high = []  # min-heap\n    out = []\n\
  \    for x in nums:\n        heapq.heappush(low, -float(x))\n        heapq.heappush(high,\
  \ -heapq.heappop(low))\n        if len(high) > len(low):\n            heapq.heappush(low,\
  \ -heapq.heappop(high))\n        if len(low) > len(high):\n            out.append(-low[0])\n\
  \        else:\n            out.append((-low[0] + high[0]) / 2.0)\n    return out\n"
