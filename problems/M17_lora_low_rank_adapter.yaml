post_training_relevance: 'From Stanford SLP3 Chapter 8 (Post-Training / Parameter-Efficient Fine-Tuning): LoRA freezes the pretrained weight matrix W_0 in R^(d x k) and injects trainable low-rank matrices A in R^(d x r) and B in R^(r x k) scaled by alpha/r.'
statement: |
  In **Stanford SLP3 Chapter 8 (Post-Training)**, **Low-Rank Adaptation (LoRA)** (Hu et al., 2022) enables parameter-efficient fine-tuning (PEFT) by freezing the pretrained weight matrix $W_0 \in \mathbb{R}^{d \times k}$ and learning a low-rank update $\Delta W = \frac{\alpha}{r} A B$, where $A \in \mathbb{R}^{d \times r}$, $B \in \mathbb{R}^{r \times k}$, and rank $r \ll \min(d, k)$.

  Given:
  - `X`: input activations of shape `(N, d)`
  - `W0`: frozen pretrained weight matrix of shape `(d, k)`
  - `A`: low-rank down-projection matrix of shape `(d, r)`
  - `B`: low-rank up-projection matrix of shape `(r, k)`
  - `alpha`: float LoRA scaling constant

  Compute:
  1. The LoRA output `Y = X @ W0 + (alpha / r) * ((X @ A) @ B)` of shape `(N, k)`.
  2. The trainable parameter compression ratio `ratio = (d * r + r * k) / (d * k)` as a float.

  Return `[Y.tolist(), float(ratio)]`.
examples:
- input: X = [[1.0, 2.0]], W0 = [[1.0, 0.0], [0.0, 1.0]], A = [[0.5], [0.5]], B = [[2.0, -2.0]], alpha = 2.0
  output: '[[[7.0, -4.0]], 1.0]'
  explanation: 'r=1, alpha/r = 2.0. Base X@W0 = [1, 2]. LoRA delta = 2.0 * ([1.5] @ [2, -2]) = [6, -6]. Output = [7, -4].'
constraints:
- 1 <= N <= 256
- 1 <= r <= d, k <= 512
- alpha > 0
