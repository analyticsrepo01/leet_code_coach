time_limit_ms: 2000
hints:
- Convert `X`, `W0`, `A`, `B` to `np.float64` arrays; infer `d, k = W0.shape` and `r = A.shape[1]`.
- Compute `(X @ A) @ B` rather than `X @ (A @ B)` so the intermediate matrix has shape `(N, r)` (`O(N(d+k)r)` FLOPs instead of `O(Ndk)`).
- Trainable parameter ratio is `(d * r + r * k) / (d * k)`.
optimal:
  time: O(N * d * k + N * (d + k) * r)
  space: O(N * k)
follow_ups:
- Why is matrix A initialized with Gaussian noise N(0, sigma^2) while matrix B is initialized to 0 at the start of SFT/Post-Training?
- Why do we scale by alpha/r, and how can LoRA weights be merged into W0 (`W_merged = W0 + (alpha/r) A B`) for zero-latency inference?
reference_solution: |
  import numpy as np

  def lora_forward(X, W0, A, B, alpha: float):
      X = np.asarray(X, dtype=np.float64)
      W0 = np.asarray(W0, dtype=np.float64)
      A = np.asarray(A, dtype=np.float64)
      B = np.asarray(B, dtype=np.float64)
      d, k = W0.shape
      r = A.shape[1]
      scale = float(alpha) / float(r)
      # Compute low-rank branch in O(N(d+k)r)
      y_base = X @ W0
      y_lora = scale * ((X @ A) @ B)
      y = y_base + y_lora
      ratio = float(d * r + r * k) / float(d * k)
      return [y.tolist(), ratio]
