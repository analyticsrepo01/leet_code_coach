hints:
- Set `labels = np.where(selected, tokens, -100)` so non-masked positions are ignored by CrossEntropyLoss.
- For `selected` positions, replace with `mask_token_id` when `u < 0.8`, `random_token_ids` when `0.8 <= u < 0.9`, and keep original `tokens` when `u >= 0.9`.
optimal:
  time: O(N)
  space: O(N)
follow_ups:
- Why does BERT use 80% [MASK], 10% random, and 10% unchanged instead of replacing 100% of selected tokens with [MASK]?
- Why can't a bidirectional Masked LM be used directly for left-to-right causal generation without an iterative Gibbs/MaskGIT schedule?
reference_solution: |
  import numpy as np

  def bert_mlm_corrupt(token_ids, selected_mask, u_action, random_token_ids, mask_token_id: int):
      tokens = np.asarray(token_ids, dtype=np.int64)
      sel = np.asarray(selected_mask, dtype=bool)
      u = np.asarray(u_action, dtype=np.float64)
      rand_tok = np.asarray(random_token_ids, dtype=np.int64)

      labels = np.where(sel, tokens, -100)
      corrupted = tokens.copy()

      mask_branch = sel & (u < 0.8)
      rand_branch = sel & (u >= 0.8) & (u < 0.9)

      corrupted[mask_branch] = int(mask_token_id)
      corrupted[rand_branch] = rand_tok[rand_branch]

      return [corrupted.tolist(), labels.tolist()]
