post_training_relevance: 'From Stanford SLP3 Chapter 9 (Masked Language Models): BERT selects 15% of tokens for prediction and applies the 80% [MASK] / 10% random token / 10% unchanged corruption rule so `[MASK]` never causes a pretraining-to-finetuning mismatch.'
statement: |
  In **Stanford SLP3 Chapter 9 (Masked Language Models)**, BERT is pretrained by selecting 15% of input tokens as masked-LM targets and applying the **80 / 10 / 10 rule** to each selected token $x_i$:
  - If `u_action[i] < 0.8`: replace $x_i$ with `mask_token_id` (80% of the time).
  - Else if `u_action[i] < 0.9`: replace $x_i$ with `random_token_ids[i]` (10% of the time).
  - Else (`u_action[i] >= 0.9`): keep $x_i$ unchanged (10% of the time).

  For unselected tokens (where `selected_mask[i] == 0`), the input token is left unchanged and its label is set to `-100` (`ignore_index`) so Cross-Entropy loss is **only** computed on the selected positions.

  Given 1D arrays `token_ids`, `selected_mask` (0 or 1), `u_action` (floats in `[0, 1)`), `random_token_ids`, and integer `mask_token_id`:
  Return `[corrupted_token_ids.tolist(), labels.tolist()]`.
examples:
- input: token_ids = [101, 2054, 2003, 1996, 102], selected_mask = [0, 1, 1, 1, 0], u_action = [0.0, 0.5, 0.85, 0.95, 0.0], random_token_ids = [0, 999, 888, 777, 0], mask_token_id = 103
  output: '[[101, 103, 888, 1996, 102], [-100, 2054, 2003, 1996, -100]]'
  explanation: 'Pos 1 (u=0.5 < 0.8) -> [MASK] (103). Pos 2 (u=0.85 in [0.8, 0.9)) -> random (888). Pos 3 (u=0.95 >= 0.9) -> kept (1996). Labels store original IDs for selected positions and -100 elsewhere.'
constraints:
- 1 <= len(token_ids) <= 2048
